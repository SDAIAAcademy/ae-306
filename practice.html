<section>
<h2>Day 1: Store and query</h2>
<ol>
<li><p>Finance points a dashboard at Qafila's order database and refreshes the monthly margin every five minutes. What breaks first?</p><ul><li><b>A.</b> Nothing: the dashboard only reads</li><li><b>B.</b> The sales app slows down while the scans run</li><li><b>C.</b> The database runs out of disk</li><li><b>D.</b> The margin becomes correct because it is live</li></ul></li>
<li><p>Your September revenue is 7 percent above finance's reference and the margin percentage is almost the same. Which check do you run first?</p><ul><li><b>A.</b> Compare every price with the ERP</li><li><b>B.</b> Check the currency conversion</li><li><b>C.</b> Count rows against distinct order-line keys</li><li><b>D.</b> Round each line before summing</li></ul></li>
<li><p>Your margin-to-date keeps growing across August, September and October instead of restarting on the first of each month. What is missing?</p><ul><li><b>A.</b> PARTITION BY month in the window</li><li><b>B.</b> ORDER BY month instead of order_date</li><li><b>C.</b> A GROUP BY month around the query</li><li><b>D.</b> ROWS BETWEEN 30 PRECEDING AND CURRENT ROW</li></ul></li>
<li><p>The lines are partitioned by month, yet a query for September still scans all three folders. The filter is WHERE strftime(order_date, '%Y-%m') = '2026-09'. Why?</p><ul><li><b>A.</b> Parquet cannot prune folders</li><li><b>B.</b> The row groups are not sorted</li><li><b>C.</b> Three folders are too few to prune</li><li><b>D.</b> The filter is on order_date, not on the partition column month</li></ul></li>
<li><p>The old margin report shows August revenue 4% above finance's figure. The order lines carry an order status. What should you check first?</p><ul><li><b>A.</b> Whether DuckDB reads the CSV dates in the wrong time zone</li><li><b>B.</b> Whether the August file is missing its last day of orders</li><li><b>C.</b> Whether the report rounds each line before summing it</li><li><b>D.</b> Whether cancelled orders are still counted as revenue</li></ul></li>
<li><p>You need each customer's running total of revenue by order date. Which query shape gives it without collapsing the rows?</p><ul><li><b>A.</b> GROUP BY customer_id, order_date with sum(revenue)</li><li><b>B.</b> sum(revenue) OVER (PARTITION BY customer_id ORDER BY order_date)</li><li><b>C.</b> sum(revenue) OVER (ORDER BY customer_id, order_date)</li><li><b>D.</b> A self-join of orders on customer_id and an earlier order_date</li></ul></li>
<li><p>The same order lines are written to two Parquet files. A query for one date reads 2 of 15 row groups in the file sorted by date, and 7 of 7 in the unsorted file. Why?</p><ul><li><b>A.</b> DuckDB caches the sorted file in memory after the first read</li><li><b>B.</b> Sorting compresses the file so that fewer row groups exist</li><li><b>C.</b> Min and max statistics per row group only exclude groups when values are clustered</li><li><b>D.</b> Unsorted files have no statistics, so DuckDB must read everything</li></ul></li>
<li><p>An incremental load that selects rows with updated_at greater than the last stored value can miss rows that arrive late with an older updated_at.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Ingest and clean</h2>
<ol>
<li><p>Tonight's extract re-sends the lines of 2 November, as it did for 14 September. Which rule in your margin query keeps the report right without anyone noticing?</p><ul><li><b>A.</b> Exclude the lines of 14 September</li><li><b>B.</b> Keep one row per order and line number</li><li><b>C.</b> Keep confirmed orders only</li><li><b>D.</b> Report the margin percentage only</li></ul></li>
<li><p>A colleague's supplier load stores the cursor correctly, but after a crash and a re-run the table holds twice the rows for one day. Which decision was missing?</p><ul><li><b>A.</b> A smaller page size</li><li><b>B.</b> Keeping the cursor in a file</li><li><b>C.</b> More retries on 429</li><li><b>D.</b> A key on the record version, enforced on insert</li></ul></li>
<li><p>The supplier API starts sending incoterm. Qafila's raw layer and its margin mart both read the feed. What should happen in each?</p><ul><li><b>A.</b> Raw adds the column; the mart waits until a model uses it</li><li><b>B.</b> Raw drops it; the mart adds it</li><li><b>C.</b> Both fail until someone approves</li><li><b>D.</b> Both add it automatically</li></ul></li>
<li><p>Two updates for supplier S-15 reach your pipeline. The second to arrive has a lower log position than the first. Which one should your copy keep?</p><ul><li><b>A.</b> The one that arrived last</li><li><b>B.</b> The one with the later outer ts_ms</li><li><b>C.</b> The one with the higher log position</li><li><b>D.</b> Either: they will reconcile later</li></ul></li>
<li><p>A price is 61.99 USD per carton of 6. Your colleague converts to riyals, rounds to two decimals, then divides by 6 and rounds again. The ERP shows a different halala. What do you change?</p><ul><li><b>A.</b> Divide by 6 before converting the currency</li><li><b>B.</b> Round once, after both steps</li><li><b>C.</b> Round the ERP's value the same way</li><li><b>D.</b> Store the cost as a 64-bit float</li></ul></li>
<li><p>The supplier API pipeline is re-run after a crash halfway through. Which design guarantees the re-run adds no duplicate price versions?</p><ul><li><b>A.</b> Sorting the API pages by price_id before inserting them</li><li><b>B.</b> Deleting the table before each run and loading everything again</li><li><b>C.</b> Storing the cursor before the rows are inserted</li><li><b>D.</b> Inserting with a key of (price_id, updated_at) and ignoring rows that exist</li></ul></li>
<li><p>A supplier changes its payment terms on 14 September. In a type 2 supplier dimension, what happens?</p><ul><li><b>A.</b> The old row is closed at 14 September and a new row starts then</li><li><b>B.</b> The supplier's row is updated in place with the new terms</li><li><b>C.</b> A new column holds the previous payment terms</li><li><b>D.</b> The supplier is deleted and inserted with a new supplier_id</li></ul></li>
<li><p>Two change events for supplier S-15 arrive out of order: the update at log position 812 arrives before the one at 790. How should the merge decide which is current?</p><ul><li><b>A.</b> By the event's source timestamp rounded to the minute</li><li><b>B.</b> By the event with more non-null fields</li><li><b>C.</b> By arrival order, since the latest arrival is the newest change</li><li><b>D.</b> By the larger log position, since the log records the commit order</li></ul></li>
<li><p>In a change feed, a delete event carries the deleted row's values in its 'before' field, not its 'after' field.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Model and test</h2>
<ol>
<li><p>Jumeirah Canning moved from the UAE to Saudi Arabia on 1 September. Finance asks for August's margin by supplier country. Which supplier table gives the right answer?</p><ul><li><b>A.</b> The type 2 history, joined on the order's creation time</li><li><b>B.</b> The merged copy of the supplier table</li><li><b>C.</b> The snapshot of 1 August</li><li><b>D.</b> The change feed itself</li></ul></li>
<li><p>Freight is charged per shipment, one shipment per order, and finance wants margin after freight by product category. What do you add to the star?</p><ul><li><b>A.</b> Join shipments to the fact in each report</li><li><b>B.</b> Freight as an attribute of the customer</li><li><b>C.</b> A freight fact on the line, allocated by a stated rule</li><li><b>D.</b> One freight total per month, outside the star</li></ul></li>
<li><p>You change the rows stg.orders returns. Qafila's project has eleven models. Which ones does a state-aware plan rebuild?</p><ul><li><b>A.</b> All eleven</li><li><b>B.</b> stg.orders and the models downstream of it</li><li><b>C.</b> stg.orders only</li><li><b>D.</b> stg.orders and the raw tables it reads</li></ul></li>
<li><p>The contract fails on a renamed column during the night run, and finance opens the margin report in the morning. What should they find?</p><ul><li><b>A.</b> A margin computed from whatever columns matched</li><li><b>B.</b> An empty report until the feed is fixed</li><li><b>C.</b> A margin with unit_cost mapped to cost automatically</li><li><b>D.</b> Yesterday's margin, labelled with its last refresh</li></ul></li>
<li><p>Four failures in last week's runs. Which one should a retry policy handle?</p><ul><li><b>A.</b> The supplier API timed out after 30 seconds</li><li><b>B.</b> The contract found a negative cost</li><li><b>C.</b> A model divides by a column that was renamed</li><li><b>D.</b> The warehouse disk is full</li></ul></li>
<li><p>Freight is recorded per shipment, and a shipment carries several order lines. After joining shipments to order lines, total freight is 3.9 times the shipments table. What went wrong?</p><ul><li><b>A.</b> Freight is in a different currency from revenue</li><li><b>B.</b> Some shipments have no order lines</li><li><b>C.</b> The join should have been a left join</li><li><b>D.</b> Freight was repeated on every line of the shipment instead of allocated</li></ul></li>
<li><p>Finance asks for margin by product category and by customer city. What is the coarsest grain of the fact that answers both?</p><ul><li><b>A.</b> One row per order</li><li><b>B.</b> One row per order line</li><li><b>C.</b> One row per customer and month</li><li><b>D.</b> One row per product and month</li></ul></li>
<li><p>A line ordered on 3 August must be costed at the supplier price valid that day. Which join condition finds it in the price history?</p><ul><li><b>A.</b> price.valid_from &lt;= order_date and (price.valid_to &gt; order_date or valid_to is null)</li><li><b>B.</b> price.valid_from &gt;= order_date, taking the earliest match</li><li><b>C.</b> price.valid_from = order_date</li><li><b>D.</b> the price row with the latest valid_from overall</li></ul></li>
<li><p>In a state-aware transformation tool, a change to one model's SQL that does not change its output columns forces every model in the project to rebuild.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>The November supplier batch arrives with a negative cost on one product. The contract check fails. What should the pipeline do?</p><ul><li><b>A.</b> Drop the bad row silently and load the rest</li><li><b>B.</b> Load the batch and flag the row for finance to review</li><li><b>C.</b> Replace the negative cost with the product's average cost</li><li><b>D.</b> Stop the refresh so yesterday's mart stays in place, and alert the feed's owner</li></ul></li>
<li><p>Qafila's order system will rename pack_size to pieces_per_carton in the products extract. Three models read pack_size, and each runs on its own schedule. Which plan keeps every model running through the change?</p><ul><li><b>A.</b> Rename the column and change all three models in one release, deployed together on the same night</li><li><b>B.</b> Add pieces_per_carton beside pack_size, fill both, move each model in turn, then drop pack_size</li><li><b>C.</b> Rename the column and let the contract block each model until its owner has updated it</li><li><b>D.</b> Add pieces_per_carton and fill both columns for good, so that no model ever has to move</li></ul></li>
<li><p>The supplier API answers 429 Too Many Requests on the third page. What is the right response in the pipeline?</p><ul><li><b>A.</b> Restart the load from the first page</li><li><b>B.</b> Skip the page and continue with the next cursor</li><li><b>C.</b> Wait for the Retry-After interval, then request the same page again</li><li><b>D.</b> Fail the run and alert the team immediately</li></ul></li>
<li><p>October's supplier batch was blocked for three days and is now fixed. The mart is partitioned by month. What should be re-run?</p><ul><li><b>A.</b> Nothing: tomorrow's scheduled run will pick it up</li><li><b>B.</b> Only the ingestion step for October</li><li><b>C.</b> The whole pipeline for all months since August</li><li><b>D.</b> Only the October partition and the models downstream of it</li></ul></li>
<li><p>A data contract is only useful if the producer of the feed agrees to it and is told when it is broken.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: Scale and production</h2>
<ol>
<li><p>Last night the supplier API timed out twice and then answered, and the contract check failed on the November batch. What should the run log show?</p><ul><li><b>A.</b> The supplier load failed; nothing else ran</li><li><b>B.</b> Everything refreshed, with two warnings</li><li><b>C.</b> The load succeeded after retries; the check failed; the prices and the mart were not refreshed</li><li><b>D.</b> The check was retried three times and then skipped</li></ul></li>
<li><p>An analyst renames cost to unit_cost in the Iceberg margin table. What happens to the Parquet files written in August?</p><ul><li><b>A.</b> They are rewritten with the new name</li><li><b>B.</b> Nothing: they are read by column id under the new name</li><li><b>C.</b> They read the column as null from now on</li><li><b>D.</b> They are dropped with the old snapshots</li></ul></li>
<li><p>Your largest table is 3 GB of order lines and your laptop has 16 GB of memory. A colleague proposes a Spark cluster for the nightly margin. What do you answer?</p><ul><li><b>A.</b> Yes: Spark is the standard for data engineering</li><li><b>B.</b> Yes, once the table passes 4 GB</li><li><b>C.</b> Wait until finance complains about speed</li><li><b>D.</b> One node, and measure again when the data grows</li></ul></li>
<li><p>Operations wants yesterday's deliveries on the screen each morning; finance closes the month from the batch. Which watermark fits operations?</p><ul><li><b>A.</b> Short, with the late events logged and the batch reconciling</li><li><b>B.</b> Three days, so nothing is ever dropped</li><li><b>C.</b> No watermark: count events as they arrive</li><li><b>D.</b> Replace the stream with the nightly batch</li></ul></li>
<li><p>A customer asked to be erased. The row is gone from today's table, but last month's Iceberg snapshot still holds the contact data. What removes it?</p><ul><li><b>A.</b> A masked view on the current table</li><li><b>B.</b> Moving the snapshot to cheaper storage</li><li><b>C.</b> Expire the snapshots that hold it and delete their files</li><li><b>D.</b> Reclassifying the old snapshot as Restricted</li></ul></li>
<li><p>The Iceberg mart is partitioned by month(order_date). An analyst filters on order_date between 1 and 15 September. What must the analyst add to the query to skip other months?</p><ul><li><b>A.</b> A filter on the order_month partition column</li><li><b>B.</b> A hint naming the September data files</li><li><b>C.</b> Nothing: the engine derives the partition from the order_date filter</li><li><b>D.</b> A cast of order_date to a month string</li></ul></li>
<li><p>Finance asks why the September margin changed since last week's report. The mart is an Iceberg table. What answers it fastest?</p><ul><li><b>A.</b> Restore last week's backup into a second database</li><li><b>B.</b> Query the table as of last week's snapshot and compare</li><li><b>C.</b> Re-run the pipeline on last week's raw files</li><li><b>D.</b> Read the transformation code's commit history</li></ul></li>
<li><p>Adding a column to an Iceberg table rewrites every existing data file.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>PyIceberg writes the mart and DuckDB reads it. DuckDB returns fewer rows than PyIceberg reports. What is the most likely cause?</p><ul><li><b>A.</b> DuckDB reads an older metadata file than the latest snapshot</li><li><b>B.</b> DuckDB cannot read Parquet written by PyIceberg</li><li><b>C.</b> DuckDB applies a default row limit to Iceberg scans</li><li><b>D.</b> Iceberg tables lose rows when read by a second engine</li></ul></li>
<li><p>Under the national classification levels, how is the mobile number of a customer's contact person classified?</p><ul><li><b>A.</b> Public, because the customer is a business</li><li><b>B.</b> Restricted, because it is personally identifiable</li><li><b>C.</b> Top Secret, because it is personal data</li><li><b>D.</b> It needs no classification, because it is not a government record</li></ul></li>
<li><p>The margin mart needs customer city and type. The raw customer table also has contact name, mobile and e-mail. What does minimisation require?</p><ul><li><b>A.</b> Leaving the three contact fields out of the mart altogether</li><li><b>B.</b> Encrypting the whole mart at rest</li><li><b>C.</b> Masking the three contact fields in the mart</li><li><b>D.</b> Restricting the mart to the finance team</li></ul></li>
<li><p>The analyst's database has a masked customers view. Which test shows the analyst cannot reach the raw mobile numbers?</p><ul><li><b>A.</b> Checking that the view's mobile column contains asterisks</li><li><b>B.</b> Reviewing the SQL that defines the masked view</li><li><b>C.</b> Attempting to read the raw customers table from the analyst's connection and expecting it to fail</li><li><b>D.</b> Counting the rows of the masked view</li></ul></li>
<li><p>After a customer is deleted from the source table, its data can still be read from type 2 history rows and from earlier table snapshots.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
</ol>
</section>

e access pattern is the problem","Confuses freshness with correctness; a live query still counts the cancelled orders"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"checkpoint-1","title":"The dashboard on the order database"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-2-q1","type":"single","prompt":"Your September revenue is 7 percent above finance's reference and the margin percentage is almost the same. Which check do you run first?","options":[{"key":"A","text":"Compare every price with the ERP"},{"key":"B","text":"Check the currency conversion"},{"key":"C","text":"Count rows against distinct order-line keys"},{"key":"D","text":"Round each line before summing"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Revenue and cost inflated by the same factor means extra rows. Rows against distinct keys at the expected grain finds them in one query.","misconceptions":["Starts from the prices; a wrong price moves cost alone and would shift the percentage","Starts from the currency; Qafila sells in riyals only, so no conversion touches revenue","","Starts from rounding; rounding moves riyals, not millions"],"lo":["LO1"],"day":1,"session":2,"slide":{"deck":"day1","id":"checkpoint-2","title":"Above the reference"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-3-q1","type":"single","prompt":"Your margin-to-date keeps growing across August, September and October instead of restarting on the first of each month. What is missing?","options":[{"key":"A","text":"PARTITION BY month in the window"},{"key":"B","text":"ORDER BY month instead of order_date"},{"key":"C","text":"A GROUP BY month around the query"},{"key":"D","text":"ROWS BETWEEN 30 PRECEDING AND CURRENT ROW"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The partition decides where a window starts again. Without it the whole table is one partition, so the total runs from the first day to the last.","misconceptions":["","Confuses order with partition; ordering decides 'so far', not where the total restarts","Moves the problem to GROUP BY, which collapses the days the running total needs","Treats the frame as the restart; the frame sets how far back, inside a partition"],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"checkpoint-3","title":"A running total that never resets"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-4-q1","type":"single","prompt":"The lines are partitioned by month, yet a query for September still scans all three folders. The filter is WHERE strftime(order_date, '%Y-%m') = '2026-09'. Why?","options":[{"key":"A","text":"Parquet cannot prune folders"},{"key":"B","text":"The row groups are not sorted"},{"key":"C","text":"Three folders are too few to prune"},{"key":"D","text":"The filter is on order_date, not on the partition column month"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The reader prunes folders by the partition column's value. A filter on another column, even one that implies the month, cannot be matched to folder names.","misconceptions":["Blames the file format; Parquet partitions prune when the filter names them","Blames the row groups; statistics work inside a file, the folders are skipped before that","Blames the size; pruning does not depend on how big the folders are",""],"lo":["LO5"],"day":1,"session":4,"slide":{"deck":"day1","id":"checkpoint-4","title":"The query that reads everything"},"level":null,"pool":"checkpoint"},{"id":"review-day-1-q1","type":"single","prompt":"Tonight's extract re-sends the lines of 2 November, as it did for 14 September. Which rule in your margin query keeps the report right without anyone noticing?","options":[{"key":"A","text":"Exclude the lines of 14 September"},{"key":"B","text":"Keep one row per order and line number"},{"key":"C","text":"Keep confirmed orders only"},{"key":"D","text":"Report the margin percentage only"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A rule stated on the grain (one row per order line) catches every re-sent batch, on any date, before it reaches a sum.","misconceptions":["Filters the symptom on one day; the next re-sent day is a different date","","Confuses the two defects; status removes cancelled orders, not repeated lines","Hides the extra rows in a ratio; the riyal totals stay inflated"],"lo":["LO1"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day-1","title":"The re-sent batch, one day later"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-1-q1","type":"single","prompt":"A colleague's supplier load stores the cursor correctly, but after a crash and a re-run the table holds twice the rows for one day. Which decision was missing?","options":[{"key":"A","text":"A smaller page size"},{"key":"B","text":"Keeping the cursor in a file"},{"key":"C","text":"More retries on 429"},{"key":"D","text":"A key on the record version, enforced on insert"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A crash between inserting and storing the cursor makes the next run fetch the same records. Only a key turns that repeat into nothing.","misconceptions":["Treats speed as the problem; a smaller page size changes how many requests, not how many copies","Moves the cursor somewhere else; it was already correct, the duplicates come from re-fetching","Retries the request more; the duplicates were fetched successfully, twice",""],"lo":["LO2"],"day":2,"session":1,"slide":{"deck":"day2","id":"checkpoint-1","title":"The doubled table"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-2-q1","type":"single","prompt":"The supplier API starts sending incoterm. Qafila's raw layer and its margin mart both read the feed. What should happen in each?","options":[{"key":"A","text":"Raw adds the column; the mart waits until a model uses it"},{"key":"B","text":"Raw drops it; the mart adds it"},{"key":"C","text":"Both fail until someone approves"},{"key":"D","text":"Both add it automatically"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Raw keeps what arrived, so nothing is lost. The mart changes only through a reviewed model, so its meaning never changes by accident.","misconceptions":["","Throws away evidence at the layer meant to keep everything as received","Stops every load for a change that breaks nothing yet","Lets an unreviewed field change the meaning of finance's tables"],"lo":["LO2"],"day":2,"session":2,"slide":{"deck":"day2","id":"checkpoint-2","title":"The column that appeared"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-3-q1","type":"single","prompt":"Two updates for supplier S-15 reach your pipeline. The second to arrive has a lower log position than the first. Which one should your copy keep?","options":[{"key":"A","text":"The one that arrived last"},{"key":"B","text":"The one with the later outer ts_ms"},{"key":"C","text":"The one with the higher log position"},{"key":"D","text":"Either: they will reconcile later"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The log position is the order in which the source database committed the changes. Only that order reproduces the source table.","misconceptions":["Trusts arrival order, which the transport can change","Trusts the send time, which records when the event left, not when the change committed","","Avoids the decision; the copy then holds an arbitrary version"],"lo":["LO2"],"day":2,"session":3,"slide":{"deck":"day2","id":"checkpoint-3","title":"Two events, which one wins?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-4-q1","type":"single","prompt":"A price is 61.99 USD per carton of 6. Your colleague converts to riyals, rounds to two decimals, then divides by 6 and rounds again. The ERP shows a different halala. What do you change?","options":[{"key":"A","text":"Divide by 6 before converting the currency"},{"key":"B","text":"Round once, after both steps"},{"key":"C","text":"Round the ERP's value the same way"},{"key":"D","text":"Store the cost as a 64-bit float"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Currency and unit are both multiplications, so their order does not matter. Rounding in between does: each rounding can move the result by half a unit of the last digit.","misconceptions":["Treats the order of two multiplications as the cause; they commute","","Changes the data to hide the rule; the ERP is the reference, not the error","Moves the problem to a wider type; the double rounding remains"],"lo":["LO3"],"day":2,"session":4,"slide":{"deck":"day2","id":"checkpoint-4","title":"Where rounding goes"},"level":null,"pool":"checkpoint"},{"id":"review-day-2-q1","type":"single","prompt":"Jumeirah Canning moved from the UAE to Saudi Arabia on 1 September. Finance asks for August's margin by supplier country. Which supplier table gives the right answer?","options":[{"key":"A","text":"The type 2 history, joined on the order's creation time"},{"key":"B","text":"The merged copy of the supplier table"},{"key":"C","text":"The snapshot of 1 August"},{"key":"D","text":"The change feed itself"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Only the history knows which version was valid when each order was placed. The copy knows only the present.","misconceptions":["","Uses today's state for last month's orders: August's orders move to Saudi Arabia","Uses the state before every change, wrong for any order after a change","Reads raw events, which hold changes, not the state at a moment"],"lo":["LO2"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day-2","title":"A supplier moves country"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-1-q1","type":"single","prompt":"Freight is charged per shipment, one shipment per order, and finance wants margin after freight by product category. What do you add to the star?","options":[{"key":"A","text":"Join shipments to the fact in each report"},{"key":"B","text":"Freight as an attribute of the customer"},{"key":"C","text":"A freight fact on the line, allocated by a stated rule"},{"key":"D","text":"One freight total per month, outside the star"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A category is a property of the line, so freight must reach the line's grain. Allocation does that, and the rule is written down where finance can agree to it.","misconceptions":["Repeats the shipment's freight on every line: the sum multiplies it","Puts a measure in a dimension, where it cannot be summed by category","","Answers a different question; the total is right but no category can be computed"],"lo":["LO3"],"day":3,"session":1,"slide":{"deck":"day3","id":"checkpoint-1","title":"Where does freight go?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-2-q1","type":"single","prompt":"You change the rows stg.orders returns. Qafila's project has eleven models. Which ones does a state-aware plan rebuild?","options":[{"key":"A","text":"All eleven"},{"key":"B","text":"stg.orders and the models downstream of it"},{"key":"C","text":"stg.orders only"},{"key":"D","text":"stg.orders and the raw tables it reads"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A change to the rows of a model can change every model that reads it, directly or not. Models that do not depend on it cannot change.","misconceptions":["Rebuilds everything like a scheduler without state; correct but wasteful","","Treats every change as non-breaking: the fact would keep the old orders","Confuses downstream with upstream; raw tables are inputs, not models"],"lo":["LO3"],"day":3,"session":2,"slide":{"deck":"day3","id":"checkpoint-2","title":"What rebuilds?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-3-q1","type":"single","prompt":"The contract fails on a renamed column during the night run, and finance opens the margin report in the morning. What should they find?","options":[{"key":"A","text":"A margin computed from whatever columns matched"},{"key":"B","text":"An empty report until the feed is fixed"},{"key":"C","text":"A margin with unit_cost mapped to cost automatically"},{"key":"D","text":"Yesterday's margin, labelled with its last refresh"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Failing safely means the last good state stays in place and says how old it is, while the owner named in the contract is alerted.","misconceptions":["Lets a batch that broke its contract reach the report","Removes a correct report to signal a problem upstream","Guesses the producer's intent without the producer",""],"lo":["LO4"],"day":3,"session":3,"slide":{"deck":"day3","id":"checkpoint-3","title":"The night run"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-4-q1","type":"single","prompt":"Four failures in last week's runs. Which one should a retry policy handle?","options":[{"key":"A","text":"The supplier API timed out after 30 seconds"},{"key":"B","text":"The contract found a negative cost"},{"key":"C","text":"A model divides by a column that was renamed"},{"key":"D","text":"The warehouse disk is full"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A retry helps only when a second attempt can succeed with nothing changed. A timeout can; a bad batch, a broken model or a full disk cannot.","misconceptions":["","Retries a data problem; the same batch fails the same rule again","Retries a code defect; the model fails the same way every time","Retries a capacity problem with more load on the same disk"],"lo":["LO4"],"day":3,"session":4,"slide":{"deck":"day3","id":"checkpoint-4","title":"Retry or block?"},"level":null,"pool":"checkpoint"},{"id":"review-day-3-q1","type":"single","prompt":"Last night the supplier API timed out twice and then answered, and the contract check failed on the November batch. What should the run log show?","options":[{"key":"A","text":"The supplier load failed; nothing else ran"},{"key":"B","text":"Everything refreshed, with two warnings"},{"key":"C","text":"The load succeeded after retries; the check failed; the prices and the mart were not refreshed"},{"key":"D","text":"The check was retried three times and then skipped"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Retries absorb the transport's failure; the blocking check stops everything downstream of the broken batch. The log must say both, and what stayed in place.","misconceptions":["Treats the retried timeout as the failure; it succeeded on the third attempt","Lets the mart refresh past a failed blocking check","","Retries a data failure that a second read cannot fix"],"lo":["LO4"],"day":4,"session":null,"slide":{"deck":"day4","id":"review-day-3","title":"The run that half failed"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-1-q1","type":"single","prompt":"An analyst renames cost to unit_cost in the Iceberg margin table. What happens to the Parquet files written in August?","options":[{"key":"A","text":"They are rewritten with the new name"},{"key":"B","text":"Nothing: they are read by column id under the new name"},{"key":"C","text":"They read the column as null from now on"},{"key":"D","text":"They are dropped with the old snapshots"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Iceberg tracks each column by an id stored in the data files' metadata. A rename changes the name attached to the id, so no file changes.","misconceptions":["Assumes a schema change rewrites data, as an ALTER on some databases does","","Matches columns by name, which is what table formats avoid","Confuses the schema with the snapshot: renames do not expire history"],"lo":["LO5"],"day":4,"session":1,"slide":{"deck":"day4","id":"checkpoint-1","title":"The rename"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-2-q1","type":"single","prompt":"Your largest table is 3 GB of order lines and your laptop has 16 GB of memory. A colleague proposes a Spark cluster for the nightly margin. What do you answer?","options":[{"key":"A","text":"Yes: Spark is the standard for data engineering"},{"key":"B","text":"Yes, once the table passes 4 GB"},{"key":"C","text":"Wait until finance complains about speed"},{"key":"D","text":"One node, and measure again when the data grows"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"3 GB fits in memory with room for the query. A single engine has no shuffle and no scheduling. The measurement, repeated as data grows, tells you when that changes.","misconceptions":["Chooses by habit: the data fits one machine several times over","Assumes memory is the only limit; the measurement decides, not a rule of thumb","Avoids the decision; the nightly job runs today and needs an engine",""],"lo":["LO4"],"day":4,"session":2,"slide":{"deck":"day4","id":"checkpoint-2","title":"Which engine?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-3-q1","type":"single","prompt":"Operations wants yesterday's deliveries on the screen each morning; finance closes the month from the batch. Which watermark fits operations?","options":[{"key":"A","text":"Short, with the late events logged and the batch reconciling"},{"key":"B","text":"Three days, so nothing is ever dropped"},{"key":"C","text":"No watermark: count events as they arrive"},{"key":"D","text":"Replace the stream with the nightly batch"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Operations values speed and accepts a small, known shortfall. Finance's completeness comes from the batch, and the reconciliation keeps the two honest.","misconceptions":["","Waits for completeness that finance's batch already provides","Uses arrival time, which puts late deliveries on the wrong day","Discards the stream's purpose; the batch is a day behind operations"],"lo":["LO4"],"day":4,"session":3,"slide":{"deck":"day4","id":"checkpoint-3","title":"One hour or one day?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-4-q1","type":"single","prompt":"A customer asked to be erased. The row is gone from today's table, but last month's Iceberg snapshot still holds the contact data. What removes it?","options":[{"key":"A","text":"A masked view on the current table"},{"key":"B","text":"Moving the snapshot to cheaper storage"},{"key":"C","text":"Expire the snapshots that hold it and delete their files"},{"key":"D","text":"Reclassifying the old snapshot as Restricted"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Time travel keeps every snapshot readable. Only expiring them, and deleting the files no snapshot references, removes the data.","misconceptions":["Masks the view while the data stays readable through time travel","Moves the data to a less used place without removing it","","Classifies without acting; a label does not erase anything"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"checkpoint-4","title":"Still in last month's snapshot"},"level":null,"pool":"checkpoint"},{"id":"de-lo1-cancelled","type":"single","prompt":"The old margin report shows August revenue 4% above finance's figure. The order lines carry an order status. What should you check first?","options":[{"key":"A","text":"Whether DuckDB reads the CSV dates in the wrong time zone"},{"key":"B","text":"Whether the August file is missing its last day of orders"},{"key":"C","text":"Whether the report rounds each line before summing it"},{"key":"D","text":"Whether cancelled orders are still counted as revenue"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A gap of several percent in one direction points to rows that should be excluded; cancelled orders were 913,673 SAR of August in the lab.","misconceptions":["A time-zone shift moves a few orders across a midnight, not 4% of a month, and it moves them both ways.","A missing day would make the report lower than finance, not higher.","Rounding moves totals by halalas, not by four percent.",""],"lo":["LO1"],"day":1,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"de-lo1-running","type":"single","prompt":"You need each customer's running total of revenue by order date. Which query shape gives it without collapsing the rows?","options":[{"key":"A","text":"GROUP BY customer_id, order_date with sum(revenue)"},{"key":"B","text":"sum(revenue) OVER (PARTITION BY customer_id ORDER BY order_date)"},{"key":"C","text":"sum(revenue) OVER (ORDER BY customer_id, order_date)"},{"key":"D","text":"A self-join of orders on customer_id and an earlier order_date"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A window function partitioned by customer and ordered by date keeps every row and accumulates within each customer.","misconceptions":["GROUP BY returns one total per customer and day, not a running total.","","Without PARTITION BY the running total carries over from one customer to the next.","The self-join works but multiplies rows and is far slower; it is what window functions replace."],"lo":["LO1"],"day":1,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"de-lo1-prune","type":"single","prompt":"The same order lines are written to two Parquet files. A query for one date reads 2 of 15 row groups in the file sorted by date, and 7 of 7 in the unsorted file. Why?","options":[{"key":"A","text":"DuckDB caches the sorted file in memory after the first read"},{"key":"B","text":"Sorting compresses the file so that fewer row groups exist"},{"key":"C","text":"Min and max statistics per row group only exclude groups when values are clustered"},{"key":"D","text":"Unsorted files have no statistics, so DuckDB must read everything"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Each row group keeps min and max values; when dates are scattered every group's range covers the date, so none can be skipped.","misconceptions":["Both runs read from disk; caching does not explain which row groups are opened.","The sorted file has more row groups, not fewer; compression is not what skips them.","","Both files have statistics; in the unsorted file they are too wide to exclude anything."],"lo":["LO1"],"day":1,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"de-lo1-incremental","type":"tf","prompt":"An incremental load that selects rows with updated_at greater than the last stored value can miss rows that arrive late with an older updated_at.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A strict high-water mark skips any row stamped before the stored value, which is why loads keep a look-back window or a key-based merge.","misconceptions":["","A row written late can carry an earlier timestamp than rows already loaded; the predicate never selects it again."],"lo":["LO1"],"day":1,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"de-lo2-rerun","type":"single","prompt":"The supplier API pipeline is re-run after a crash halfway through. Which design guarantees the re-run adds no duplicate price versions?","options":[{"key":"A","text":"Sorting the API pages by price_id before inserting them"},{"key":"B","text":"Deleting the table before each run and loading everything again"},{"key":"C","text":"Storing the cursor before the rows are inserted"},{"key":"D","text":"Inserting with a key of (price_id, updated_at) and ignoring rows that exist"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A key per version makes each insert idempotent, so pages loaded before the crash are skipped on the re-run.","misconceptions":["Order does not stop the same row from being inserted twice.","A full reload avoids duplicates but discards the history of versions the API no longer serves.","Saving the cursor first loses the rows of the failed page: they are never requested again.",""],"lo":["LO2"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"de-lo2-scd","type":"single","prompt":"A supplier changes its payment terms on 14 September. In a type 2 supplier dimension, what happens?","options":[{"key":"A","text":"The old row is closed at 14 September and a new row starts then"},{"key":"B","text":"The supplier's row is updated in place with the new terms"},{"key":"C","text":"A new column holds the previous payment terms"},{"key":"D","text":"The supplier is deleted and inserted with a new supplier_id"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Type 2 keeps every version with a validity range, so an order from August still joins the terms it was placed under.","misconceptions":["","Updating in place is type 1: August orders would then show September's terms.","A previous-value column is type 3; it keeps one earlier value, not the full history.","Changing the business key breaks every join from orders and history to the supplier."],"lo":["LO2"],"day":2,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"de-lo2-lsn","type":"single","prompt":"Two change events for supplier S-15 arrive out of order: the update at log position 812 arrives before the one at 790. How should the merge decide which is current?","options":[{"key":"A","text":"By the event's source timestamp rounded to the minute"},{"key":"B","text":"By the event with more non-null fields"},{"key":"C","text":"By arrival order, since the latest arrival is the newest change"},{"key":"D","text":"By the larger log position, since the log records the commit order"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The log sequence number orders commits in the source database; arrival order depends on the network.","misconceptions":["Rounded timestamps can tie, and clocks can differ; the log position cannot.","Field counts say nothing about which change happened later.","Arrival order is what went wrong here: 812 arrived first but 790 committed first.",""],"lo":["LO2"],"day":2,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"de-lo2-delete","type":"tf","prompt":"In a change feed, a delete event carries the deleted row's values in its 'before' field, not its 'after' field.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A delete has no after-image; the before-image is the only place the key of the deleted row appears.","misconceptions":["","The after field of a delete is empty; reading it loses the key of the deleted supplier."],"lo":["LO2"],"day":2,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"de-lo3-freight","type":"single","prompt":"Freight is recorded per shipment, and a shipment carries several order lines. After joining shipments to order lines, total freight is 3.9 times the shipments table. What went wrong?","options":[{"key":"A","text":"Freight is in a different currency from revenue"},{"key":"B","text":"Some shipments have no order lines"},{"key":"C","text":"The join should have been a left join"},{"key":"D","text":"Freight was repeated on every line of the shipment instead of allocated"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Joining a coarser grain to a finer one repeats the coarse value on each row; it must be allocated across the lines.","misconceptions":["A currency mismatch would scale every row by one rate, not by the number of lines.","Shipments with no lines would lower the total, not multiply it.","Join type changes which rows survive, not how often freight repeats.",""],"lo":["LO3"],"day":3,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"de-lo3-grain","type":"single","prompt":"Finance asks for margin by product category and by customer city. What is the coarsest grain of the fact that answers both?","options":[{"key":"A","text":"One row per order"},{"key":"B","text":"One row per order line"},{"key":"C","text":"One row per customer and month"},{"key":"D","text":"One row per product and month"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Category belongs to the product on the line and city to the customer on the order, so only the line carries both.","misconceptions":["An order mixes products of several categories, so its margin cannot be split by category.","","Aggregating by customer loses which products were sold.","Aggregating by product loses which customers bought them."],"lo":["LO3"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"de-lo3-asof","type":"single","prompt":"A line ordered on 3 August must be costed at the supplier price valid that day. Which join condition finds it in the price history?","options":[{"key":"A","text":"price.valid_from \u003c= order_date and (price.valid_to > order_date or valid_to is null)"},{"key":"B","text":"price.valid_from >= order_date, taking the earliest match"},{"key":"C","text":"price.valid_from = order_date"},{"key":"D","text":"the price row with the latest valid_from overall"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The valid row is the one whose range contains the order date; an open range means it is still current.","misconceptions":["","That picks the first price after the order, a price the line was never sold under.","Prices rarely change on the exact day of an order, so most lines would find no cost.","The latest price is today's; it re-prices every past line at the current cost."],"lo":["LO3"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"de-lo3-state","type":"tf","prompt":"In a state-aware transformation tool, a change to one model's SQL that does not change its output columns forces every model in the project to rebuild.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Only the changed model and its downstream models are affected, and a non-breaking change can rebuild only the model itself, as Lab 3.2 showed with one rebuild.","misconceptions":["The tool compares versions of each model and skips those whose definition and inputs are unchanged.",""],"lo":["LO3"],"day":3,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"de-lo4-block","type":"single","prompt":"The November supplier batch arrives with a negative cost on one product. The contract check fails. What should the pipeline do?","options":[{"key":"A","text":"Drop the bad row silently and load the rest"},{"key":"B","text":"Load the batch and flag the row for finance to review"},{"key":"C","text":"Replace the negative cost with the product's average cost"},{"key":"D","text":"Stop the refresh so yesterday's mart stays in place, and alert the feed's owner"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A blocking check keeps a broken feed from reaching the mart; the owner fixes the feed and the month is backfilled.","misconceptions":["Silent drops hide the defect from the feed's owner, so it returns next month.","Once loaded, the wrong cost reaches finance's report before anyone reviews it.","An invented cost is still wrong, and now nobody can tell it was invented.",""],"lo":["LO4"],"day":3,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"de-lo4-parallel-change","type":"single","prompt":"Qafila's order system will rename pack_size to pieces_per_carton in the products extract. Three models read pack_size, and each runs on its own schedule. Which plan keeps every model running through the change?","options":[{"key":"A","text":"Rename the column and change all three models in one release, deployed together on the same night"},{"key":"B","text":"Add pieces_per_carton beside pack_size, fill both, move each model in turn, then drop pack_size"},{"key":"C","text":"Rename the column and let the contract block each model until its owner has updated it"},{"key":"D","text":"Add pieces_per_carton and fill both columns for good, so that no model ever has to move"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Expand, migrate, contract: the new column arrives beside the old one, a check confirms both hold the same value, each model moves when it is ready, and the old column goes only after the last one has moved.","misconceptions":["One release for producer and consumers breaks every model that is late, missed or run from another schedule.","","A blocking contract keeps bad data out; it does not keep the models running, and every one stops at once.","Never removing the old column leaves two names for one fact, and they drift apart."],"lo":["LO4"],"day":3,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"de-lo4-retry","type":"single","prompt":"The supplier API answers 429 Too Many Requests on the third page. What is the right response in the pipeline?","options":[{"key":"A","text":"Restart the load from the first page"},{"key":"B","text":"Skip the page and continue with the next cursor"},{"key":"C","text":"Wait for the Retry-After interval, then request the same page again"},{"key":"D","text":"Fail the run and alert the team immediately"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A 429 is temporary: retrying the same page after the stated wait loses nothing and duplicates nothing.","misconceptions":["Restarting wastes requests, and the limit will be hit again at the same place.","Skipping a page loses its rows for good, since the cursor has moved past them.","","Failing on a temporary limit makes the pipeline fragile for no reason."],"lo":["LO4"],"day":3,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"de-lo4-backfill","type":"single","prompt":"October's supplier batch was blocked for three days and is now fixed. The mart is partitioned by month. What should be re-run?","options":[{"key":"A","text":"Nothing: tomorrow's scheduled run will pick it up"},{"key":"B","text":"Only the ingestion step for October"},{"key":"C","text":"The whole pipeline for all months since August"},{"key":"D","text":"Only the October partition and the models downstream of it"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A backfill of the affected partition rebuilds what the fix changed and leaves the other months untouched.","misconceptions":["Tomorrow's run processes tomorrow's partition, not October's.","Ingesting the batch without rebuilding the models leaves the mart unchanged.","Rebuilding every month costs more and risks changing figures finance has signed off.",""],"lo":["LO4"],"day":3,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"de-lo4-owner","type":"tf","prompt":"A data contract is only useful if the producer of the feed agrees to it and is told when it is broken.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A contract is an agreement between producer and consumer; a check the producer never hears about only blocks, it never fixes.","misconceptions":["","Without the producer, the same violation returns with every batch and the mart stays blocked."],"lo":["LO4"],"day":3,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"de-lo5-hidden","type":"single","prompt":"The Iceberg mart is partitioned by month(order_date). An analyst filters on order_date between 1 and 15 September. What must the analyst add to the query to skip other months?","options":[{"key":"A","text":"A filter on the order_month partition column"},{"key":"B","text":"A hint naming the September data files"},{"key":"C","text":"Nothing: the engine derives the partition from the order_date filter"},{"key":"D","text":"A cast of order_date to a month string"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Hidden partitioning stores the transform in the table metadata, so a filter on the source column prunes partitions by itself.","misconceptions":["Iceberg exposes no partition column to filter; the transform is applied for you.","Readers never name data files; the metadata lists them.","","Casting the column hides the predicate from the planner and can stop pruning."],"lo":["LO5"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"de-lo5-snapshot","type":"single","prompt":"Finance asks why the September margin changed since last week's report. The mart is an Iceberg table. What answers it fastest?","options":[{"key":"A","text":"Restore last week's backup into a second database"},{"key":"B","text":"Query the table as of last week's snapshot and compare"},{"key":"C","text":"Re-run the pipeline on last week's raw files"},{"key":"D","text":"Read the transformation code's commit history"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Each commit leaves a snapshot, so the table as it was last week can be read directly and compared.","misconceptions":["A restore works but takes far longer and needs a backup to exist.","","Re-running assumes the raw files and code are unchanged, which is the question.","Code history shows what changed in the logic, not in the data."],"lo":["LO5"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"de-lo5-evolve","type":"tf","prompt":"Adding a column to an Iceberg table rewrites every existing data file.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Schema changes are metadata operations; old files return null for the new column when they are read.","misconceptions":["Column ids in the metadata let readers map old files to the new schema without rewriting them.",""],"lo":["LO5"],"day":4,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"de-lo5-engines","type":"single","prompt":"PyIceberg writes the mart and DuckDB reads it. DuckDB returns fewer rows than PyIceberg reports. What is the most likely cause?","options":[{"key":"A","text":"DuckDB reads an older metadata file than the latest snapshot"},{"key":"B","text":"DuckDB cannot read Parquet written by PyIceberg"},{"key":"C","text":"DuckDB applies a default row limit to Iceberg scans"},{"key":"D","text":"Iceberg tables lose rows when read by a second engine"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Each engine reads the snapshot its metadata pointer names; pointing it at a stale metadata file shows an earlier state.","misconceptions":["","Both use standard Parquet; an unreadable file would raise an error, not return fewer rows.","There is no default row limit on a scan; a limit would appear in the query.","Engines read the same files; Lab 4.1 showed identical results at both snapshots."],"lo":["LO5"],"day":4,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"de-lo6-contact","type":"single","prompt":"Under the national classification levels, how is the mobile number of a customer's contact person classified?","options":[{"key":"A","text":"Public, because the customer is a business"},{"key":"B","text":"Restricted, because it is personally identifiable"},{"key":"C","text":"Top Secret, because it is personal data"},{"key":"D","text":"It needs no classification, because it is not a government record"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The policy's examples of Restricted data include personally identifiable information such as names and phone numbers.","misconceptions":["The business is not the person: the number identifies an individual.","","Top Secret is for damage to national interests; personal data alone does not reach it.","The policy applies to all data the entity holds, whatever its origin."],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"de-lo6-minimise","type":"single","prompt":"The margin mart needs customer city and type. The raw customer table also has contact name, mobile and e-mail. What does minimisation require?","options":[{"key":"A","text":"Leaving the three contact fields out of the mart altogether"},{"key":"B","text":"Encrypting the whole mart at rest"},{"key":"C","text":"Masking the three contact fields in the mart"},{"key":"D","text":"Restricting the mart to the finance team"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The PDPL limits personal data to the minimum necessary for the purpose; fields the margin does not need should not be there at all.","misconceptions":["","Encryption protects data at rest but keeps fields the purpose does not need.","Masking is for fields a role needs in some form; these are not needed.","Access rules limit who sees the data, not how much of it is collected."],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"de-lo6-access","type":"single","prompt":"The analyst's database has a masked customers view. Which test shows the analyst cannot reach the raw mobile numbers?","options":[{"key":"A","text":"Checking that the view's mobile column contains asterisks"},{"key":"B","text":"Reviewing the SQL that defines the masked view"},{"key":"C","text":"Attempting to read the raw customers table from the analyst's connection and expecting it to fail"},{"key":"D","text":"Counting the rows of the masked view"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A masked view proves nothing if the raw table is still readable; the access test must try the raw table and fail.","misconceptions":["The view can be masked while the raw table beside it is open.","Reading the code is a review, not a test of what the role can actually reach.","","Row counts say nothing about which columns are exposed."],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"de-lo6-erasure","type":"tf","prompt":"After a customer is deleted from the source table, its data can still be read from type 2 history rows and from earlier table snapshots.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"History tables and snapshots keep old versions by design, so erasure must also close history and expire snapshots.","misconceptions":["","Deleting the current row leaves every earlier version in history and in each snapshot until they are expired."],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"understand","pool":"practice"}]}</script>
